name: Publish to WinGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: false
        type: string
  release:
    types: [published]

# Only `gh release view` against this repo runs on the GITHUB_TOKEN; the
# winget-pkgs fork operations use the WINGET_PUBLISH_PAT secret.
permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest # action can only be run on windows
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Determine version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ "$EVENT_NAME" = "release" ]; then
            VERSION="$RELEASE_TAG"
          else
            VERSION="$(gh release view --json tagName -q .tagName)"
          fi

          # Constrain the version shape so shell metacharacters can't reach
          # downstream steps; fail closed on anything unexpected.
          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)*$ ]]; then
            echo "invalid version: $VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync winget-pkgs fork with upstream
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_PUBLISH_PAT }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/Suwayomi/winget-pkgs/merge-upstream" \
            -f branch=master

      # NOTE(security): winget-releaser is a third-party action holding a
      # write-capable PAT; pinned to a commit SHA. Replacing it with a
      # hand-rolled `gh api` manifest submission is a follow-up.
      - uses: vedantmgoyal2009/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: Suwayomi.Suwayomi-Server
          installers-regex: '.*x64.msi$'
          token: ${{ secrets.WINGET_PUBLISH_PAT }}
          version: ${{ steps.version.outputs.version }}
          release-tag: ${{ steps.version.outputs.version }}
