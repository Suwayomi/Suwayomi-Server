name: Docker Build Stable

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_publish_docker_container:
    # Only actual stable releases (v* tags) trigger the stable docker build.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: run docker build and publish script
        env:
          DEPLOY_DOCKER_TOKEN: ${{ secrets.DEPLOY_DOCKER_TOKEN }}
        run: |
          # --fail makes curl exit non-zero on 401/422 instead of reporting a
          # false success; the dispatch endpoint returns 204 on success.
          curl --fail -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $DEPLOY_DOCKER_TOKEN" \
            -d '{"ref":"main", "inputs":{"tachidesk_release_type": "stable"}}' \
            https://api.github.com/repos/suwayomi/suwayomi-server-docker/actions/workflows/build_container_images.yml/dispatches
